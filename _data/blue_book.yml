      “Go at once, this very minute, stand at the cross-roads, bow down, first kiss the earth which you have defiled and then bow down to all the world and say to all men aloud, ‘I am a murderer!’ Then God will send you life again. Will you go, will you go?” she asked him, trembling all over, snatching his two hands, squeezing them tight in hers and gazing at him with eyes full of fire.
