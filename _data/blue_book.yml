- id: jane-eyre
  title: Jane Eyre
  author: Charlotte Brontë
  year: 1847
  window: 2
  form: novel
  clue: English novelist
  gutenberg: 1260
  passages:
    - locus: Chapter 23
      difficulty: 2
      text: >-
        “I tell you I must go!” I retorted, roused to something like passion. “Do you think I can stay to become nothing to you? Do you think I am an automaton?—a machine without feelings? and can bear to have my morsel of bread snatched from my lips, and my drop of living water dashed from my cup? Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless? You think wrong!—I have as much soul as you,—and full as much heart! And if God had gifted me with some beauty and much wealth, I should have made it as hard for you to leave me, as it is now for me to leave you. I am not talking to you now through the medium of custom, conventionalities, nor even of mortal flesh;—it is my spirit that addresses your spirit; just as if both had passed through the grave, and we stood at God’s feet, equal,—as we are!”
      significance: >-
        Jane insists to Rochester that her poverty and plainness do not make her his inferior, speaking to him as an equal soul rather than a dependent. The speech is the novel's central statement of Jane's self respect and its refusal to treat love as a matter of rank or fortune. It is also the moment that leads directly to Rochester's proposal.
    - locus: Chapter 27
      difficulty: 3
      text: >-
        Still indomitable was the reply—“I care for myself. The more solitary, the more friendless, the more unsustained I am, the more I will respect myself. I will keep the law given by God; sanctioned by man. I will hold to the principles received by me when I was sane, and not mad—as I am now. Laws and principles are not for the times when there is no temptation: they are for such moments as this, when body and soul rise in mutiny against their rigour; stringent are they; inviolate they shall be. If at my individual convenience I might break them, what would be their worth?
      significance: >-
        Jane resolves to leave Rochester rather than remain with him under false pretenses, even though it means giving up the person she loves most. She chooses principle over desire because she believes rules exist for exactly this kind of moment. The passage is the clearest expression of the moral discipline that defines her character.
