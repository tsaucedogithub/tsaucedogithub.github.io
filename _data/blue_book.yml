      difficulty: 3
      text: >-
        He did not know that the new life would not be given him for nothing, that he would have to pay dearly for it, that it would cost him great striving, great suffering.


        But that is the beginning of a new story--the story of the gradual renewal of a man, the story of his gradual regeneration, of his passing from one world into another, of his initiation into a new unknown life. That might be the subject of a new story, but our present story is ended.
      significance: >-
        The narrator steps back from Raskolnikov's ongoing renewal to note that this transformation belongs to a different story than the one just told. The line marks the boundary Dostoevsky deliberately draws between crime and redemption, declining to dramatize the second the way he dramatized the first. It closes the novel while pointing at a story it will not tell.
