    - locus: Part 1, Chapter 1
      difficulty: 2
      text: >-
        In a village of La Mancha, the name of which I have no desire to call to mind, there lived not long since one of those gentlemen that keep a lance in the lance-rack, an old buckler, a lean hack, and a greyhound for coursing. An olla of rather more beef than mutton, a salad on most nights, scraps on Saturdays, lentils on Fridays, and a pigeon or so extra on Sundays, made away with three-quarters of his income. The rest of it went in a doublet of fine cloth and velvet breeches and shoes to match for holidays, while on week-days he made a brave figure in his best homespun. He had in his house a housekeeper past forty, a niece under twenty, and a lad for the field and market-place, who used to saddle the hack as well as handle the bill-hook. The age of this gentleman of ours was bordering on fifty; he was of a hardy habit, spare, gaunt-featured, a very early riser and a great sportsman. They will have it his surname was Quixada or Quesada (for here there is some difference of opinion among the authors who write on the subject), although from reasonable conjectures it seems plain that he was called Quexana. This, however, is of but little importance to our tale; it will be enough not to stray a hair’s breadth from the truth in the telling of it.
      significance: >-
        The narrator introduces the aging hidalgo who will soon reinvent himself as Don Quixote, describing his modest household and habits before any madness appears. The famously evasive opening line, refusing to name his village, sets the ironic and unreliable tone the whole narration keeps. It establishes the gap between the ordinary man and the legend he is about to build for himself.
    - locus: Part 2, Chapter 74
      difficulty: 3
      text: >-
        Good news for you, good sirs, that I am no longer Don Quixote of La Mancha, but Alonso Quixano, whose way of life won for him the name of Good. Now am I the enemy of Amadis of Gaul and of the whole countless troop of his descendants; odious to me now are all the profane stories of knight-errantry; now I perceive my folly, and the peril into which reading them brought me; now, by God’s mercy schooled into my right senses, I loathe them.
      significance: >-
        On his deathbed, Alonso Quixano renounces the name and the chivalric romances that turned him into Don Quixote, calling his old obsession folly. The return of sanity just before death gives the book a sober final note after two volumes of comic delusion. It leaves open whether the world was better served by his illusions or by their loss.
  famous:
    locus: Part 1, Chapter 8
    text: >-
      “Fortune is arranging matters for us better than we could have shaped our desires ourselves, for look there, friend Sancho Panza, where thirty or more monstrous giants present themselves, all of whom I mean to engage in battle and slay, and with whose spoils we shall begin to make our fortunes; for this is righteous warfare, and it is God’s good service to sweep so evil a breed from off the face of the earth.”


      “What giants?” said Sancho Panza.


      “Those thou seest there,” answered his master, “with the long arms, and some have them nearly two leagues long.”


      “Look, your worship,” said Sancho; “what we see there are not giants but windmills, and what seem to be their arms are the sails that turned by the wind make the millstone go.”
