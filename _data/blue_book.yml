        In short, I maintain that all great men or even men a little out of the common, that is to say capable of giving some new word, must from their very nature be criminals--more or less, of course. Otherwise it’s hard for them to get out of the common rut; and to remain in the common rut is what they can’t submit to, from their very nature again, and to my mind they ought not, indeed, to submit to it. You see that there is nothing particularly new in all that. The same thing has been printed and read a thousand times before. As for my division of people into ordinary and extraordinary, I acknowledge that it’s somewhat arbitrary, but I don’t insist upon exact numbers. I only believe in my leading idea that men are in general divided by a law of nature into two categories, inferior (ordinary), that is, so to say, material that serves only to reproduce its kind, and men who have the gift or the talent to utter a new word.
      significance: >-
        Raskolnikov lays out his theory that certain extraordinary men are permitted to break ordinary morality because they carry humanity forward. The passage is the intellectual justification he built for himself before the murder, and its coldness is meant to unsettle. It is the clearest statement of the idea the rest of the novel spends dismantling.
