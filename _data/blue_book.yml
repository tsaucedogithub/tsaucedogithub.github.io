    - locus: Episode 3, Proteus
      difficulty: 3
      text: >-
        Ineluctable modality of the visible: at least that if no more, thought through my eyes. Signatures of all things I am here to read, seaspawn and seawrack, the nearing tide, that rusty boot. Snotgreen, bluesilver, rust: coloured signs. Limits of the diaphane. But he adds: in bodies. Then he was aware of them bodies before of them coloured. How? By knocking his sconce against them, sure. Go easy. Bald he was and a millionaire, maestro di color che sanno. Limit of the diaphane in. Why in? Diaphane, adiaphane. If you can put your five fingers through it it is a gate, if not a door. Shut your eyes and see.
      significance: >-
        Stephen walks the strand testing his own senses, closing his eyes to check whether the world still exists when he cannot see it. The passage is Joyce's clearest statement of the novel's interest in perception as a subject in its own right. It establishes the interior style that carries through the rest of the book.
    - locus: Episode 2, Nestor
      difficulty: 3
      text: >-
        —History, Stephen said, is a nightmare from which I am trying to awake.


        From the playfield the boys raised a shout. A whirring whistle: goal. What if that nightmare gave you a back kick?


        —The ways of the Creator are not our ways, Mr Deasy said. All human history moves towards one great goal, the manifestation of God.


        Stephen jerked his thumb towards the window, saying:


        —That is God.


        Hooray! Ay! Whrrwhee!


        —What? Mr Deasy asked.


        —A shout in the street, Stephen answered, shrugging his shoulders.
      significance: >-
        Stephen tells his employer Mr Deasy that history is a nightmare he is trying to wake from, rejecting Deasy's tidy providential view of the past. The line is one of the most quoted in the book because it compresses Stephen's whole relationship to Irish history. Deasy's self satisfied reply only widens the gap between them.
